name: Build Windows Informant Toolchain

on:
  workflow_dispatch:

jobs:
  build-windows-toolchain:
    name: Build Inweb 7.2.0 + Intest 2.1.0 — windows target
    runs-on: windows-latest

    steps:
      # Prevent Git on the Windows runner from converting shell scripts
      # to CRLF during checkout.
      - name: Disable Git CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Set up MSYS2 CLANG64
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            make
            mingw-w64-clang-x86_64-clang

      - name: Show Windows build environment
        shell: msys2 {0}
        run: |
          set -eux

          echo "=== System ==="
          uname -a

          echo "=== Bash ==="
          bash --version

          echo "=== Make ==="
          make --version

          echo "=== Clang ==="
          clang --version

          echo "=== Tool paths ==="
          which bash
          which make
          which clang

      # ----------------------------------------------------------------
      # Source
      # ----------------------------------------------------------------

      - name: Check out Inweb 7.2.0
        uses: actions/checkout@v4
        with:
          repository: interactivefiction/inweb
          ref: inweb-7.2.0
          path: inweb

      - name: Check out Intest 2.1.0
        uses: actions/checkout@v4
        with:
          repository: interactivefiction/intest
          ref: intest-2.1.0
          path: intest

      # ----------------------------------------------------------------
      # Build
      # ----------------------------------------------------------------

      - name: Build Inweb 7.2.0 for Windows
        shell: msys2 {0}
        run: |
          set -eux

          # Inweb selects the target platform during bootstrap.
          bash inweb/scripts/first.sh windows

      - name: Build Intest 2.1.0
        shell: msys2 {0}
        run: |
          set -eux

          # Match the established bootstrap sequence.
          # Intest's first.sh is invoked without a platform argument.
          bash intest/scripts/first.sh

      # ----------------------------------------------------------------
      # Inspect
      # ----------------------------------------------------------------

      - name: Inspect Windows build results
        if: always()
        shell: msys2 {0}
        run: |
          echo "=================================================="
          echo "INWEB"
          echo "=================================================="

          echo
          echo "=== Inweb executables ==="
          find inweb -maxdepth 4 -type f \
            \( -name 'inweb' -o -name 'inweb.exe' \) \
            -print || true

          echo
          echo "=== Inweb Tangled contents ==="
          ls -la inweb/Tangled 2>/dev/null || true

          echo
          echo "=== Inweb generated build files ==="
          find inweb -maxdepth 4 -type f \
            \( -name 'Makefile' -o -name '*.mk' \) \
            -print || true

          echo
          echo "=== Inweb executable identification ==="
          if [ -f inweb/Tangled/inweb.exe ]; then
            file inweb/Tangled/inweb.exe
          fi

          echo
          echo "=================================================="
          echo "INTEST"
          echo "=================================================="

          echo
          echo "=== Intest executables ==="
          find intest -maxdepth 4 -type f \
            \( -name 'intest' -o -name 'intest.exe' \) \
            -print || true

          echo
          echo "=== Intest Tangled contents ==="
          ls -la intest/Tangled 2>/dev/null || true

          echo
          echo "=== Intest generated build files ==="
          find intest -maxdepth 4 -type f \
            \( -name 'Makefile' -o -name '*.mk' \) \
            -print || true

          echo
          echo "=== Intest executable identification ==="
          if [ -f intest/Tangled/intest.exe ]; then
            file intest/Tangled/intest.exe
          fi
